[package]
name = "ironclad-cosigner"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The PCZT checks, keys, sessions, DKG and backups come from frost-zec (MIT,
# Khadim's crate); Ironclad adds the policy, the ledger and the daemon. This
# pins master plus OpenPGP-Wallet/frost-zec#9 (the structured payment report
# policy.rs reads), which is not in a crates.io release yet. Move to the
# crates.io version once a release includes #9.
[dependencies]
frost-zec = { git = "https://github.com/adilhusain01/frost-zec", rev = "28b5b700da5f86c8a36333a23fb4ea9442e3802c", default-features = false }
blake3 = "1"
hex = "0.4"
# The NU7 releases of the Zcash libraries (2026-10-21), the same pins as frost-zec.
orchard = { version = "=0.16.0", default-features = false, features = ["std", "unstable-frost"] }
# FROST (reddsa 0.5.2) still takes rand 0.8.
rand = "0.8"
reddsa = { version = "=0.5.2", features = ["frost"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcash_address = "=0.14.0"
zcash_protocol = "=0.11.0"

# The tamper suite (tests/tamper.rs, from frost-zec) builds PCZTs with
# zcash_primitives' builder.
[dev-dependencies]
ff = "0.14"
rand10 = { package = "rand", version = "0.10", default-features = false, features = ["sys_rng"] }
pczt = { version = "=0.10.0", features = ["io-finalizer", "zcp-builder", "signer", "prover", "tx-extractor"] }
zcash_primitives = { version = "=0.31.0", default-features = false, features = ["std", "non-standard-fees"] }
