name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  counter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: counter } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
  cosigner:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cosigner } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cosigner }
      - run: cargo test --release
